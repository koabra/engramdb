[package]
name = "engramdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Content-addressed hybrid storage with EnQL and Arrow Flight"
license = "Apache-2.0"

[dependencies]
arc-swap = "1"
arrow = "59.3.0"
arrow-flight = "59.3.0"
blake3 = "1"
crc32fast = "1"
futures = "0.3.34"
io-uring = "0.7"
libc = "0.2"
parking_lot = "0.12"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.5"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
loom = "0.7"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "phase1-bench"
path = "src/bin/phase1_bench.rs"
